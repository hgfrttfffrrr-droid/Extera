
name: Build Extera Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Extera
        uses: actions/checkout@v4

      - name: Checkout Matrix SDK
        run: |
          git clone --depth 1 \
            https://github.com/ExteraApp/matrix-dart-sdk.git \
            ../matrix-dart-sdk

      - name: Upgrade Gradle
        run: |
          sed -i -E \
            's/gradle-[0-9]+(\.[0-9]+){1,2}-(all|bin)\.zip/gradle-8.14.3-\2.zip/' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade Android Gradle Plugin
        run: |
          FILE=""
          if [ -f android/settings.gradle.kts ]; then
            FILE="android/settings.gradle.kts"
          elif [ -f android/settings.gradle ]; then
            FILE="android/settings.gradle"
          else
            echo "Settings file not found"
            exit 1
          fi

          sed -i 's/8\.9\.1/8.11.1/g' "$FILE"
          grep -n 'com.android.application' "$FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Extera-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
