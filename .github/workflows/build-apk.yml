
name: Build Extera Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Extera
        uses: actions/checkout@v4

      - name: Checkout Matrix SDK
        run: |
          git clone --depth 1 \
            https://github.com/ExteraApp/matrix-dart-sdk.git \
            ../matrix-dart-sdk

      - name: Upgrade Gradle Wrapper
        run: |
          sed -i -E \
            's/gradle-[0-9]+(\.[0-9]+){1,2}-(all|bin)\.zip/gradle-8.14.3-\2.zip/' \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Extera-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
